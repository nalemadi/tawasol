{% extends "index.html" %}
{% block body %}
    <div class="row" style="margin-top:5%;">
        <div class="col-lg-4 col-lg-offset-4">
            <h1>{{current_user.username}}'s Profile</h1>
            <form action="" method="POST" role="form">
                <div class="form-group">
                    <label for="keywords">Keywords</label>
                    <input type="keywords" class="form-control" name="keywords" id="keywords" aria-describedby="keywordsHelp"
                           placeholder="Enter keywords; for example: keyword1,keyword2, ..." value="{% if user_keywords %}{{user_keywords}}{% endif%}">
                </div>
                <div class="form-group">
                    <label for="accounts">Accounts</label>
                    <input type="accounts" class="form-control" name="accounts" id="accounts"
                           placeholder="Enter Accounts; for example: account1,account2, ..." value="{% if user_accounts %}{{user_accounts}}{% endif%}">
                </div>
                <button type="submit" class="btn btn-success">Save</button>
            </form>
        </div>
    </div>
{% endblock %}
