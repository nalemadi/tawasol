{% extends "base.html" %}
{% block body %}
{% include "navbar.html" %}
    <div class="row" style="margin-top:5%; padding-left: 5%;">
        <div class="col-lg-12">
            <h1>{{current_username}}'s Dashboard</h1>
        </div>
    </div>
    <meta id="my-data" data-name="{{user_email}}" data-other="">
   <div class="row" style="margin-top:5%">
        <div class="col-lg-12 col-md-12">
            <div class="col-lg-3 col-md-3">
                <div class="panel panel-info">
{#                    style="color: #ffffff;background-color: #09c5e2;border-color: #09c5e2"#}
                    <div class="panel-heading">
                        <h3><a class="fa fa-twitter fa-lg pull-left" style="/*color: #FFF;*/"></a>Tweets</h3>
                        <h3 style="padding-left: 15%;"><div id="tweets_count" style="/*color: #ffffff;font-size: large*/">coming soon</div></h3>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-3">
                 <div class="panel panel-info">
                    <div class="panel-heading">
                       <h3><a class="fa fa-retweet fa-lg pull-left" style="/*color: #FFF;*/"></a>Users</h3>
                       <h3 style="padding-left: 15%;"><div id="users_count" style="/*color: #ffffff;font-size: large*/">coming soon</div></h3>
                    </div>
                 </div>
            </div>

            <div class="col-lg-3 col-md-3">
                <div class="panel panel-info">
                    <div class="panel-heading">
                        <h3><a class="fa fa-comments-o fa-lg pull-left" style="/*color: #FFF;*/"></a>Last update</h3>
                        <h3 style="padding-left: 15%;"><div id="last_update" style="/*color: #ffffff;font-size: large*/">coming soon</div></h3>
                    </div>
                </div>
            </div>
        </div>
   </div>
    <div class="row">
      <div class="col-lg-11 col-md-11">
         <div class="panel panel-info">
            <div class="panel-heading">
               <h4>Users Distribution<a class="fa fa-signal fa-lg pull-right" data-toggle="tooltip" title="" id="varTooltip" data-placement="bottom" style="color: #FFF;"></a></h4>
            </div>
            <div class="panel-body" style="background: #3FBBEE; ">
               <div id="users_distribution" class="panel-fit"></div>
            </div>
         </div>
      </div>
   </div>
{% endblock %}
