prod:
        mongo:
                host: '[REDACTED_IP]'
                port: [REDACTED_PORT]
                db_name: 'tawasol'
                tweets_collection: 'tweets'
        sqlite:
                db_name: 'tawasol.sqlite'
        redis:
                host: 'localhost'
                port: [REDACTED_VALUE]
                hostname: tawasol_prod
                channels:
                        tweets: tweets
                        results: results_prod
        twitter:
                consumer_key: '[REDACTED_CONSUMER_KEY]'
                consumer_secret: '[REDACTED_CONSUMER_SECRET]'
                access_token: '[REDACTED_ACCESS_TOKEN]'
                access_token_secret: '[REDACTED_ACCESS_TOKEN_SECRET]'
        proxy:
                twitter_proxy: '[REDACTED_PROXYADD][REDACTED_VALUE]:[REDACTED_VALUE]'
